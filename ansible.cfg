[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = ./collections:~/.ansible/collections
forks                = 10
# auto_silent: playbooks/detect_os.yml sets the system Python for each node itself
#   EL8 = /usr/libexec/platform-python, EL9/EL10 = /usr/bin/python3
interpreter_python   = auto_silent
retry_files_enabled  = False
callback_result_format = yaml
# A vault password file can be used (never commit it), e.g.:
# vault_password_file = ~/.vault_pass_pgha

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
