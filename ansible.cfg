[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = ./collections:~/.ansible/collections
forks                = 10
# auto_silent: playbooks/detect_os.yml จะตั้ง Python ของระบบให้แต่ละ node เอง
#   EL8 = /usr/libexec/platform-python, EL9/EL10 = /usr/bin/python3
interpreter_python   = auto_silent
retry_files_enabled  = False
callback_result_format = yaml
# ใส่ไฟล์รหัสผ่าน vault ได้ (อย่า commit ไฟล์นี้) เช่น:
# vault_password_file = ~/.vault_pass_pgha

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
