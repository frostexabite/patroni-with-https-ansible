---
# =====================================================================
#  ค่าของไซต์ — ใส่ IP / subnet / VIP ของคุณเอง (ไฟล์นี้ยังเป็นแม่แบบ)
#
#  วิธีที่ 1 (แนะนำ) ถาม-ตอบทีละค่า ตรวจความถูกต้องให้ แล้วเขียนไฟล์นี้ใหม่ทั้งไฟล์:
#      python3 scripts/setup-inventory.py
#  วิธีที่ 2 แก้ไฟล์นี้เอง: แทนทุกค่าที่อยู่ใน <...> ด้วยค่าจริง
#
#  preflight จะหยุดทันที (ก่อน SSH) ถ้ายังมี <...> เหลือ, IP ผิดรูปแบบ, IP ซ้ำ,
#  IP/VIP อยู่นอก cluster_network_cidr หรือ VIP ชนกับ IP ของ node
#
#  - จำนวน host ใน pg_cluster ต้องเป็นเลขคี่ >= 3 (etcd quorum) — เพิ่ม/ลบ host ได้
#  - host แรก = Leader ตอน bootstrap และ keepalived MASTER (priority สูงสุด)
#  - ชื่อ host = hostname ของ OS + ชื่อ member ใน etcd/Patroni (a-z, 0-9, -)
#    (ตั้งให้เสร็จก่อนรันครั้งแรก — เปลี่ยนภายหลังไม่ได้ง่าย ๆ)
#  - ถ้า SSH ผ่าน IP อื่น (เช่น management network) ให้ ansible_host = IP ที่ SSH ได้
#    และเพิ่ม node_ip: <IP ใน cluster subnet> ใต้ host นั้น
# =====================================================================
all:
  children:
    pg_cluster:
      hosts:
        pg-node-1:
          ansible_host: "<IP-node-1>"          # เช่น 10.10.10.11
        pg-node-2:
          ansible_host: "<IP-node-2>"          # เช่น 10.10.10.12
        pg-node-3:
          ansible_host: "<IP-node-3>"          # เช่น 10.10.10.13

      vars:
        # subnet ที่ node ทั้งหมดอยู่ (ใช้กับ firewall + pg_hba) — IP ทุก node ต้องอยู่ในวงนี้
        cluster_network_cidr: "<CIDR-cluster>"   # เช่น 10.10.10.0/24

        # subnet ของ application ที่ต่อเข้า HAProxy 5000/5001 และ PostgreSQL (ใส่ได้หลายวง)
        app_allowed_cidrs:
          - "<CIDR-app>"                       # เช่น 10.10.20.0/24

        # Virtual IP สำหรับ application — ต้องอยู่ใน cluster_network_cidr และยังไม่มีใครใช้
        keepalived_enabled: true               # false = ไม่ใช้ VIP (app ต่อ HAProxy ของ node ใดก็ได้)
        keepalived_vip: "<VIP>"                # เช่น 10.10.10.10
        keepalived_vip_prefix: 24              # prefix ของ VIP (ปกติเท่ากับ prefix ของ cluster_network_cidr)
        keepalived_router_id: 51               # virtual_router_id 1-255 ห้ามซ้ำกับ VRRP อื่นใน LAN เดียวกัน
        # keepalived_interface: ens192         # ปกติไม่ต้องใส่ — ใช้ interface ที่มี IP ของ node อยู่

  vars:
    ansible_user: ansible                      # user ที่ SSH เข้าได้และ sudo แบบ NOPASSWD
    ansible_become: true
