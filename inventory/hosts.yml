---
# =====================================================================
#  Site settings — enter your own IPs / subnet / VIP (this file is still a template)
#
#  Option 1 (recommended): interactive, validates every value, then rewrites this whole file:
#      python3 scripts/setup-inventory.py
#  Option 2: edit this file by hand: replace every <...> value with a real one
#
#  preflight stops immediately (before SSH) if any <...> is left, an IP is malformed or duplicated,
#  an IP/VIP is outside cluster_network_cidr, or the VIP clashes with a node IP
#
#  - pg_cluster must have an odd number of hosts >= 3 (etcd quorum) — hosts can be added/removed
#  - the first host = Leader at bootstrap and keepalived MASTER (highest priority)
#  - host name = OS hostname + etcd/Patroni member name (a-z, 0-9, -)
#    (settle it before the first run — it is hard to change later)
#  - if SSH goes through another IP (e.g. a management network), set ansible_host = the SSH IP
#    and add node_ip: <IP in the cluster subnet> under that host
# =====================================================================
all:
  children:
    pg_cluster:
      hosts:
        pg-node-1:
          ansible_host: "<IP-node-1>"          # e.g. 10.10.10.11
        pg-node-2:
          ansible_host: "<IP-node-2>"          # e.g. 10.10.10.12
        pg-node-3:
          ansible_host: "<IP-node-3>"          # e.g. 10.10.10.13

      vars:
        # subnet all nodes live in (used for firewall + pg_hba) — every node IP must be inside it
        cluster_network_cidr: "<CIDR-cluster>"   # e.g. 10.10.10.0/24

        # application subnets allowed to reach HAProxy 5000/5001 and PostgreSQL (several allowed)
        app_allowed_cidrs:
          - "<CIDR-app>"                       # e.g. 10.10.20.0/24

        # Virtual IP for applications — must be inside cluster_network_cidr and unused
        keepalived_enabled: true               # false = no VIP (apps connect to HAProxy on any node)
        keepalived_vip: "<VIP>"                # e.g. 10.10.10.10
        keepalived_vip_prefix: 24              # VIP prefix (normally the prefix of cluster_network_cidr)
        keepalived_router_id: 51               # virtual_router_id 1-255, must not clash with other VRRP on the same LAN
        # keepalived_interface: ens192         # normally leave unset — uses the interface holding the node IP

  vars:
    ansible_user: ansible                      # SSH user with passwordless (NOPASSWD) sudo
    ansible_become: true
