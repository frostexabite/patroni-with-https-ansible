---
# https when tls_enabled (etcd_client_scheme can be overridden — used by playbooks/enable-tls.yml)
etcd_client_scheme: "{{ tls_scheme }}"
etcd_endpoints: >-
  {{ groups['pg_cluster'] | map('extract', hostvars, 'node_ip')
     | map('regex_replace', '^', etcd_client_scheme ~ '://') | map('regex_replace', '$', ':' ~ etcd_client_port) | join(',') }}
# etcdctl TLS arguments (the node client certificate — readable by root only)
etcdctl_tls_args: >-
  {{ ['--cacert=' ~ tls_ca_cert, '--cert=' ~ tls_node_cert, '--key=' ~ tls_node_key]
     if etcd_client_scheme == 'https' else [] }}

# ---- Steps for moving an existing cluster to TLS (playbooks/enable-tls.yml sets these — normally leave alone) ----
#   final  = normal values (per tls_enabled)
#   dual1  = client: http+https on the same port (advertise http) | peer: http:2380 + https:<etcd_peer_port_tmp>
#   dual2  = client: http+https on the same port (advertise http) | peer: https:<tmp> + https:2380
etcd_tls_stage: final
