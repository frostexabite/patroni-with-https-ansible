---
# ใช้ PostgreSQL จาก AppStream ของ OS — ถอด PGDG repo ออก (ถ้ามี)
# เพื่อไม่ให้ dnf สลับไปใช้แพ็กเกจ PGDG ตอนอัปเดต
- name: Remove PGDG repository package if present
  ansible.builtin.dnf:
    name: pgdg-redhat-repo
    state: absent

# EL8/EL9: PostgreSQL อยู่ใน module stream (postgresql:13, :15, :16, ...) ต้อง enable stream ที่ต้องการก่อน
- name: Enable the AppStream module stream (EL8/EL9) for PostgreSQL {{ pg_version }}
  when: el_major | int < 10
  block:
    - name: Read postgresql module streams
      ansible.builtin.command: dnf -q module list postgresql
      register: postgresql_modules
      changed_when: false
      check_mode: false

    - name: Require an AppStream module stream for PostgreSQL {{ pg_version }}
      ansible.builtin.assert:
        that: "postgresql_modules.stdout is search('(?m)^postgresql\\s+' ~ pg_version ~ '(\\s|$)')"
        fail_msg: >-
          AppStream on EL{{ el_major }} has no postgresql:{{ pg_version }} module stream.
          Use pg_install_source: pgdg (or auto), or a pg_version listed by `dnf module list postgresql`.
        quiet: true

    # [e] = enabled ; ถ้าเคยใช้โหมด pgdg (module ถูก disable) หรือ enable stream อื่นไว้ ต้อง reset ก่อน
    - name: Reset the postgresql module (switching from another stream or from pgdg mode)
      ansible.builtin.command: dnf -qy module reset postgresql
      when: "postgresql_modules.stdout is not search('(?m)^postgresql\\s+' ~ pg_version ~ '\\s+(\\[[a-z]\\])*\\[e\\]')"
      changed_when: true

    - name: Enable postgresql:{{ pg_version }}
      ansible.builtin.command: "dnf -qy module enable postgresql:{{ pg_version }}"
      when: "postgresql_modules.stdout is not search('(?m)^postgresql\\s+' ~ pg_version ~ '\\s+(\\[[a-z]\\])*\\[e\\]')"
      changed_when: true
