---
# Build keepalived (latest) from a Git tag — checks the commit matches the pinned one before building
- name: Remove distro keepalived package (avoid two binaries/units)
  ansible.builtin.dnf:
    name: keepalived
    state: absent

- name: Check installed keepalived version
  ansible.builtin.command: "{{ keepalived_bin }} --version"
  register: keepalived_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Build and install keepalived {{ keepalived_version }}
  when: >-
    ('Keepalived v' ~ keepalived_version ~ ' ')
    not in ((keepalived_installed.stderr | default('')) ~ (keepalived_installed.stdout | default('')))
  block:
    - name: Install build dependencies
      ansible.builtin.dnf:
        name: [gcc, make, git, autoconf, automake, pkgconf-pkg-config, openssl-devel]
        state: "{{ package_state }}"

    - name: Fetch keepalived source (tag v{{ keepalived_version }})
      ansible.builtin.git:
        repo: "{{ keepalived_git_repo }}"
        dest: "{{ build_src_dir }}/keepalived-{{ keepalived_version }}"
        version: "v{{ keepalived_version }}"
        depth: 1
        force: true
      register: keepalived_src

    - name: Verify source commit matches the pinned commit
      ansible.builtin.assert:
        that: keepalived_src.after == keepalived_git_commit
        fail_msg: "Tag v{{ keepalived_version }} resolved to {{ keepalived_src.after }}, expected {{ keepalived_git_commit }}."
        quiet: true

    - name: Generate configure script
      ansible.builtin.command:
        cmd: ./autogen.sh
        chdir: "{{ build_src_dir }}/keepalived-{{ keepalived_version }}"
      changed_when: true

    - name: Configure keepalived (VRRP only, no IPVS)
      ansible.builtin.command:
        cmd: "./configure {{ keepalived_configure_options }}"
        chdir: "{{ build_src_dir }}/keepalived-{{ keepalived_version }}"
      changed_when: true

    - name: Compile keepalived
      ansible.builtin.command:
        cmd: "make -j{{ ansible_facts['processor_vcpus'] | default(2) }}"
        chdir: "{{ build_src_dir }}/keepalived-{{ keepalived_version }}"
      changed_when: true

    - name: Install keepalived binary to /usr/local/sbin
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ build_src_dir }}/keepalived-{{ keepalived_version }}"
      changed_when: true
      notify: Restart keepalived

- name: Create keepalived config directory
  ansible.builtin.file:
    path: /etc/keepalived
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write keepalived systemd unit
  ansible.builtin.template:
    src: keepalived.service.j2
    dest: /etc/systemd/system/keepalived.service
    mode: "0644"
  notify: Restart keepalived
