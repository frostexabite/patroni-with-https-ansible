---
# =====================================================================
#  TLS with a cluster-owned CA
#    guard.yml : site.yml must not switch http ↔ https on a running cluster (use playbooks/enable-tls.yml)
#    ca.yml    : create the CA once on the control node (<inventory>/pki) — never again while nodes trust the old one
#    node.yml  : private key created on the node (never leaves it) → CSR → signed by the control node → certificate installed
#                renewed automatically when fewer than tls_cert_renew_days days remain
# =====================================================================
- name: Guard against switching http/https on a running cluster
  ansible.builtin.import_tasks: guard.yml
  tags: [always]

- name: Cluster CA and node certificates
  when: tls_enabled | bool
  block:
    - name: Cluster CA (control node)
      ansible.builtin.import_tasks: ca.yml

    - name: Node key, CSR and signed certificate
      ansible.builtin.import_tasks: node.yml
