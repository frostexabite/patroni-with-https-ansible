---
# PostgreSQL re-reads ssl_cert_file / ssl_key_file / ssl_ca_file on reload (no restart)
# A plain Patroni reload does not reload PostgreSQL when no parameter changed, so pg_ctl reload is called here
# (the Patroni REST API reloads its certificate on SIGHUP — see "Reload Patroni TLS files" below)
# Skipped while PostgreSQL is not running (no postmaster.pid)
- name: Reload PostgreSQL TLS files
  ansible.builtin.command:
    argv: ["{{ pg_bin_dir }}/pg_ctl", reload, -D, "{{ pg_data_dir }}"]
    removes: "{{ pg_data_dir }}/postmaster.pid"
  become: true
  become_user: postgres
  changed_when: true

# Patroni REST API reloads its certificate on SIGHUP — only if Patroni is running (never starts it, that would skip the bootstrap order)
- name: Reload Patroni TLS files
  ansible.builtin.shell: systemctl is-active --quiet patroni && systemctl reload patroni || true  # noqa: command-instead-of-module
  changed_when: true
