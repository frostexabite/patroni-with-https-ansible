---
# SIGHUP — Patroni อ่าน patroni.yml ใหม่ (เขียน pg_hba / reload PostgreSQL) โดยไม่ restart
# เฉพาะ node ที่ Patroni รันอยู่แล้วก่อน play นี้ — ถ้ายังไม่รัน task start จะใช้ config ใหม่เอง
# (state: reloaded บน service ที่หยุดอยู่จะ "start" ให้ ซึ่งจะข้ามลำดับ bootstrap)
- name: Reload patroni
  ansible.builtin.systemd_service:
    name: patroni
    state: reloaded
  when: patroni_was_active | default(false) | bool
