---
# Patroni reads the etcd3 section (hosts / protocol / certificates) only at start — a reload is not enough
# Keep a copy of it to compare: whenever it changes → rolling restart in maintenance mode (patroni role)
- name: Record the DCS connection settings (changes need a Patroni restart)
  ansible.builtin.copy:
    dest: "{{ patroni_config_dir }}/.dcs-connection"
    owner: postgres
    group: postgres
    mode: "0600"
    content: |
      # Ansible managed (roles/patroni) — used to decide whether Patroni needs a restart
      scheme: {{ tls_scheme }}
      hosts: {{ groups['pg_cluster'] | map('extract', hostvars, 'node_ip') | join(',') }}:{{ etcd_client_port }}
      {% if tls_enabled | bool %}
      cacert: {{ tls_ca_cert }}
      cert: {{ tls_node_cert }}
      key: {{ tls_postgres_key }}
      {% endif %}
  register: patroni_dcs_conn
